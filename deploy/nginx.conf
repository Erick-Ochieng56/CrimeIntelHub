# Minimal nginx for production profile (API proxy + static SPA)
# Cloudflare Full (strict): HTTPS at edge → HTTPS origin on :443
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 50M;

    # Prefer Cloudflare's X-Forwarded-Proto when present.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream django {
        server backend:8000;
    }

    # HTTP: redirect to HTTPS (Cloudflare Origin CA; keep :80 open for health/ACME later).
    server {
        listen 80;
        server_name crime.erickochieng.co.ke _;

        # Uncomment for Let's Encrypt HTTP-01 instead of Origin CA:
        # location /.well-known/acme-challenge/ {
        #     root /var/www/certbot;
        # }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS origin — Cloudflare Full (strict) validates this cert.
    server {
        listen 443 ssl http2;
        server_name crime.erickochieng.co.ke _;

        ssl_certificate     /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location /api/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /swagger/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /health/ {
            proxy_pass http://django;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Django static / media (collected or uploaded files)
        location /static/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
        }

        location /media/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
        }

        location / {
            root /usr/share/nginx/spa;
            try_files $uri $uri/ /index.html;
        }
    }
}
