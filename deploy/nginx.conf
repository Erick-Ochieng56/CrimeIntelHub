# Minimal nginx for production profile (API + SPA proxy)
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 50M;

    upstream django {
        server backend:8000;
    }

    upstream vite {
        server frontend:3000;
    }

    # Cloudflare Flexible SSL terminates HTTPS at the edge; origin listens on :80.
    server {
        listen 80;
        server_name crime.erickochieng.co.ke;

        location /api/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /swagger/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
        }

        location /health/ {
            proxy_pass http://django;
        }

        # Django static / media (collected or uploaded files)
        location /static/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
        }

        location /media/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://vite;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
