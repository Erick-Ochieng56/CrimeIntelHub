# Local + production share this stack: PostGIS + Redis + Django (GDAL in Linux image).
# Windows: do NOT install GDAL — run everything via Docker.
#
# Dev:  docker compose up --build
# Prod: docker compose --profile production up --build -d

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ${DB_NAME:-crime_analysis_db}
      POSTGRES_USER: ${DB_USER:-crime_analysis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crime_analysis_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crime_analysis_user} -d ${DB_NAME:-crime_analysis_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      DB_NAME: ${DB_NAME:-crime_analysis_db}
      DB_USER: ${DB_USER:-crime_analysis_user}
      DB_PASSWORD: ${DB_PASSWORD:-crime_analysis_password}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Self-hosted OSRM (compose profile `routing`); proxy returns 503 if down
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      # Empty = use system libs inside the image (no Windows paths)
      GDAL_LIBRARY_PATH: ""
      GEOS_LIBRARY_PATH: ""
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Avoid Windows CRLF shebang break when ./backend is bind-mounted
    entrypoint: ["sh", "-c", "sed -i 's/\\r$//' /app/docker-entrypoint.sh && exec sh /app/docker-entrypoint.sh \"$$@\"", "--"]
    # Dev server without auto-reload avoids ERR_EMPTY_RESPONSE during file watches
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000", "--noreload"]

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
      # Browser fallback if Django route proxy is unreachable (prefer proxy)
      VITE_OSRM_URL: ${VITE_OSRM_URL:-http://localhost:5000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # Optional self-hosted OSRM (Kenya extract) — enable with:
  #   ./scripts/download-osrm-kenya.sh   # once (~300 MB)
  #   docker compose --profile routing up -d osrm
  # Optional helper (needs Docker Hub): docker compose --profile routing run --rm osrm-download
  osrm-download:
    image: curlimages/curl:8.5.0
    profiles: ["routing"]
    volumes:
      - ./data/osrm:/data
      - ./deploy/osrm:/scripts:ro
    environment:
      OSRM_DATA_DIR: /data
      OSRM_REGION_NAME: kenya-latest
      OSRM_PBF_URL: ${OSRM_PBF_URL:-https://download.geofabrik.de/africa/kenya-latest.osm.pbf}
    entrypoint: ["/bin/sh", "/scripts/download.sh"]

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["routing"]
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    environment:
      OSRM_DATA_DIR: /data
      OSRM_REGION_NAME: kenya-latest
    volumes:
      - ./data/osrm:/data
      - ./deploy/osrm:/scripts:ro
    ports:
      - "${OSRM_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/5000'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 600s

  # Optional reverse proxy — enable with: --profile production
  nginx:
    image: nginx:alpine
    profiles: ["production"]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:
  frontend_node_modules:

networks:
  default:
    name: crime_analysis_network
