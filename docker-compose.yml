# Local + production share this stack: PostGIS + Redis + Django (GDAL in Linux image).
# Windows: do NOT install GDAL — run everything via Docker.
#
# Dev:  docker compose up --build   (set DEBUG=True in the root .env for local dev)
# Prod: docker compose --profile production up --build -d
#
# Host ports for db, redis, backend and osrm are bound to 127.0.0.1 only, so they are
# reachable from this machine (local dev, host tools) but not from the internet.
# In production, nginx reaches the backend over the internal Docker network.

x-backend-env: &backend-env
  # Safe default: production unless DEBUG=True is set explicitly
  DEBUG: ${DEBUG:-False}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
  DB_NAME: ${DB_NAME:-crime_analysis_db}
  DB_USER: ${DB_USER:?DB_USER must be set in .env}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
  DB_HOST: db
  DB_PORT: "5432"
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5000}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  # Opt-in; empty default. Set in root .env for Cloudflare/proxy HTTPS deploys.
  TRUST_X_FORWARDED_PROTO: ${TRUST_X_FORWARDED_PROTO:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  # Self-hosted OSRM (compose profile `routing`); proxy returns 503 if down
  OSRM_URL: ${OSRM_URL:-http://osrm:5000}
  # Empty = use system libs inside the image (no Windows paths)
  GDAL_LIBRARY_PATH: ""
  GEOS_LIBRARY_PATH: ""
  # Outgoing email (alert notifications, password resets). Console backend prints
  # mail to the logs; set EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
  # and the EMAIL_HOST* values in .env for real delivery.
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@crimespace.org}
  EMAIL_HOST: ${EMAIL_HOST:-localhost}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  # Background worker queue (defaults to the REDIS_URL above)
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  # 1 = Django runserver (local). Unset/0 = gunicorn (production default).
  DJANGO_DEV_SERVER: ${DJANGO_DEV_SERVER:-0}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

services:
  db:
    image: imresamu/postgis:16-3.4-bookworm
    platform: linux/arm64
    environment:
      POSTGRES_DB: ${DB_NAME:-crime_analysis_db}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${DB_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER must be set in .env} -d ${DB_NAME:-crime_analysis_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Avoid Windows CRLF shebang break when ./backend is bind-mounted
    entrypoint: ["sh", "-c", "sed -i 's/\\r$//' /app/docker-entrypoint.sh && exec sh /app/docker-entrypoint.sh \"$$@\"", "--"]
    # gunicorn by default; DJANGO_DEV_SERVER=1 in .env runs Django's dev server instead
    command: ["web"]

  # Background worker: ETL imports and alert notification emails
  worker:
    build: ./backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["sh", "-c", "sed -i 's/\\r$$//' /app/docker-entrypoint.sh && exec sh /app/docker-entrypoint.sh \"$$@\"", "--"]
    command: ["celery", "-A", "crime_analysis", "worker", "-l", "info", "--concurrency", "${CELERY_CONCURRENCY:-2}"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A crime_analysis inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Scheduler: runs due scheduled imports and alert email digests
  beat:
    build: ./backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["sh", "-c", "sed -i 's/\\r$$//' /app/docker-entrypoint.sh && exec sh /app/docker-entrypoint.sh \"$$@\"", "--"]
    command: ["celery", "-A", "crime_analysis", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    # The image's HTTP health check is for the web server, not the scheduler
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
      # Browser fallback if Django route proxy is unreachable (prefer proxy)
      VITE_OSRM_URL: ${VITE_OSRM_URL:-http://localhost:5000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # Build output for the production nginx SPA. Named volume hides host dist/.
      - frontend_dist:/app/dist
    # Default (FRONTEND_MODE unset) stays the Vite dev server. preview builds at
    # start so VITE_API_BASE_URL is baked in, then sleeps (nginx serves dist).
    # NODE_ENV=production overrides the service default so the bundle is not a dev build.
    command:
      - sh
      - -c
      - 'if [ "${FRONTEND_MODE:-}" = preview ]; then NODE_ENV=production npm run build && sleep infinity; else npm run dev -- --host 0.0.0.0 --port 3000 --strictPort; fi'
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # Optional self-hosted OSRM (Kenya extract) — enable with:
  #   ./scripts/download-osrm-kenya.sh   # once (~300 MB)
  #   docker compose --profile routing up -d osrm
  # Optional helper (needs Docker Hub): docker compose --profile routing run --rm osrm-download
  osrm-download:
    image: curlimages/curl:8.5.0
    profiles: ["routing"]
    volumes:
      - ./data/osrm:/data
      - ./deploy/osrm:/scripts:ro
    environment:
      OSRM_DATA_DIR: /data
      OSRM_REGION_NAME: kenya-latest
      OSRM_PBF_URL: ${OSRM_PBF_URL:-https://download.geofabrik.de/africa/kenya-latest.osm.pbf}
    entrypoint: ["/bin/sh", "/scripts/download.sh"]

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["routing"]
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    environment:
      OSRM_DATA_DIR: /data
      OSRM_REGION_NAME: kenya-latest
    volumes:
      - ./data/osrm:/data
      - ./deploy/osrm:/scripts:ro
    ports:
      - "127.0.0.1:${OSRM_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/5000'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 600s

  # Optional reverse proxy — enable with: --profile production
  # Full (strict): place Cloudflare Origin CA files in deploy/certs/ (origin.pem + origin.key)
  nginx:
    image: nginx:alpine
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - frontend_dist:/usr/share/nginx/spa:ro
    # Wait until the frontend build has written index.html (dev does not).
    command:
      - sh
      - -c
      - 'while [ ! -f /usr/share/nginx/spa/index.html ]; do sleep 1; done; exec nginx -g "daemon off;"'
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:
  frontend_node_modules:
  frontend_dist:

networks:
  default:
    name: crime_analysis_network
